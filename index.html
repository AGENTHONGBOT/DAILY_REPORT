<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Market Briefing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>📈 Daily Market Briefing</h1>
    <p>매일 9시 브리핑 아카이브</p>
  </header>

  <main>
    <section id="latest" class="card"></section>
    <section class="grid-two">
      <section class="card">
        <h2>브리핑 목록</h2>
        <input id="search" placeholder="제목/키워드 검색" />
        <ul id="briefing-list"></ul>
      </section>
      <section class="card" id="viewer">
        <h2>본문 미리보기</h2>
        <div id="post-view">왼쪽 목록에서 브리핑을 선택하세요.</div>
      </section>
    </section>
  </main>

  <footer>
    <small>Generated for 마스터 홍</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
